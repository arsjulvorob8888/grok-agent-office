<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1017">
<title>Кремль — штаб агентов</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c8102e'/%3E%3Cpath d='M16 5l3.2 6.6 7.3.9-5.3 5 1.3 7.2L16 21.3l-6.5 3.4 1.3-7.2-5.3-5 7.3-.9z' fill='%23f5c451'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="day">
<div id="app">
  <svg id="map" aria-label="Карта Москвы с агентами" role="img">
    <defs>
      <pattern id="landGrid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" class="grid-line"/></pattern>
      <pattern id="cobble" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 3h6M3 0v6" stroke="#5a3a2e" stroke-width=".5" opacity=".5"/></pattern>
      <radialGradient id="vignette" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".55"/></radialGradient>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <filter id="edge" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="14"/></filter>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>
    <g id="world">
      <g id="mapBase"></g>
      <g id="mapLabels"></g>
      <g id="cars"></g>
      <g id="blocks"></g>
      <g id="links"></g>
      <g id="landmarks"></g>
      <g id="agents"></g>
      <g id="fx"></g>
    </g>
  </svg>
  <div id="overlay" aria-hidden="false"></div>
  <div class="vignette"></div>

  <header class="hud">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 32 32"><path d="M16 4l3.4 7 7.6.9-5.6 5.2 1.4 7.6L16 21l-6.8 3.7 1.4-7.6L5 11.9l7.6-.9z"/></svg></div>
      <div class="brand-text"><b>Кремль</b><span>Штаб агентов · Москва</span></div>
    </div>
    <div class="stats">
      <div class="stat" title="Всего задач в журнале"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z M15 3v4h4 M9 12h7 M9 16h5"/></svg><span class="stat-label">Задачи</span><b id="stTasks">0</b></div>
      <div class="stat" title="Агенты, которые сейчас работают"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-7 8-7s7 2.5 8 7"/></svg><span class="stat-label">В работе</span><b id="stActive">0/0</b></div>
      <div class="stat energy" title="Энергия города: растёт от активных агентов и выполненных задач"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span class="stat-label">Энергия</span><div class="bar"><i id="stEnergyBar"></i></div><b id="stEnergy">0%</b></div>
    </div>
    <div class="hud-actions">
      <button class="icon-btn" id="btnNeeds" title="Нужно от вас" aria-label="Нужно от вас" aria-expanded="false" aria-controls="needsPop"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 13 6 9z"/><path d="M10 18a2 2 0 0 0 4 0"/></svg><span class="needs-count" id="needsBadge">0</span></button>
      <button class="icon-btn" id="btnHier" title="Иерархия" aria-label="Иерархия" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M12 7.2V12H6.2V15.6M12 12h5.8v3.6"/></svg></button>
      <button class="icon-btn" id="btnJournal" title="Журнал заданий" aria-label="Журнал заданий"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z M8 4v13 M11 9h5 M11 13h5"/></svg></button>
      <button class="icon-btn" id="btnHome" title="Вся карта" aria-label="Показать всю карту"><svg viewBox="0 0 24 24"><path d="M4 9V4h5 M20 9V4h-5 M4 15v5h5 M20 15v5h-5"/></svg></button>
      <button class="icon-btn" id="btnTheme" title="День / ночь" aria-label="День или ночь"><svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg><svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      <button class="icon-btn" id="btnSound" title="Звук выключен" aria-label="Звук"><svg class="i-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z M17 9l5 6 M22 9l-5 6"/></svg><svg class="i-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z M17 8.5a5 5 0 0 1 0 7 M19.5 6a8.5 8.5 0 0 1 0 12"/></svg></button>
      <button class="icon-btn" id="btnKey" title="Пароль доступа" aria-label="Пароль доступа"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9 M16 7l3 3 M14 9l2 2"/></svg></button>
    </div>
  </header>

  <aside id="hier" class="card glass" aria-label="Иерархия агентов">
    <div class="card-head"><h3>Иерархия</h3><span class="pill" id="hCount">0</span><button class="icon-btn sm" id="hClose" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="hier-note">Главный агент, направления и помощники. Нажми строку — карта подъедет к агенту.</p>
    <div class="org-tree" id="hTree"></div>
  </aside>

  <aside id="needsPop" class="card glass" aria-label="Нужно от вас" aria-hidden="true">
    <div class="card-head"><h3>Нужно от вас</h3><span class="pill" id="needsCount">0</span><button class="icon-btn sm" id="needsClose" type="button" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="needs-list" id="needsList"></div>
    <div class="needs-actions">
      <button class="btn ghost" id="needsLater" type="button">Напомнить позже</button>
      <button class="btn gold" id="needsNotify" type="button">Включить уведомления</button>
    </div>
  </aside>

  <aside id="journal" class="card glass">
    <div class="card-head"><h3>Журнал заданий</h3><span class="pill" id="jCount">0</span><button class="icon-btn sm" id="jClose" aria-label="Свернуть"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button></div>
    <div class="quest-list" id="jList"></div>
  </aside>

  <nav id="roster" aria-label="Агенты"></nav>

  <div id="minimap" class="glass" title="Мини-карта: нажми, чтобы перелететь">
    <svg viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid meet"><use href="#mapBase"/><g id="miniDots"></g><rect id="miniView" class="mini-view" x="0" y="0" width="100" height="100" rx="8"/></svg>
  </div>

  <aside id="panel" class="glass" aria-live="polite"></aside>
  <div id="toasts"></div>
  <div id="tooltip"></div>

  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <form class="modal-box glass" id="pwForm">
      <div class="modal-star"><svg viewBox="0 0 32 32"><path d="M16 4l3.4 7 7.6.9-5.6 5.2 1.4 7.6L16 21l-6.8 3.7 1.4-7.6L5 11.9l7.6-.9z"/></svg></div>
      <h3 id="mTitle">Пропуск в штаб</h3>
      <p>Введи пароль доступа (<code>APP_PASSWORD</code> из Render). Он хранится только в этом браузере.</p>
      <input type="password" id="pwInput" autocomplete="current-password" placeholder="Пароль" required>
      <div class="modal-actions"><button type="button" class="btn ghost" id="pwCancel">Отмена</button><button type="submit" class="btn gold">Войти</button></div>
      <button type="button" class="link-btn" id="pwForget">Забыть сохранённый пароль</button>
    </form>
  </div>
</div>
<script src="/js/figures.js"></script>
<script src="/js/map.js"></script>
<script src="/js/feed.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
